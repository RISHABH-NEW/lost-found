<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Lost & Found Campus Portal</title>
  <meta name="description" content="Log in securely to your college campus Lost & Found account.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar" id="navbar"></header>

  <main style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="container-narrow">
      <div class="card auth-card-wrapper" style="padding: 2.5rem; max-width: 480px; margin: 0 auto; border-color: rgba(56, 189, 248, 0.25);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="brand-icon" style="margin: 0 auto 1rem; width: 3.25rem; height: 3.25rem; font-size: 1.5rem;">
            🔐
          </div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">
            Sign in with your campus credentials to report belongings, view contacts, and manage posts.
          </p>
        </div>

        <!-- Quick One-Click Demo Credentials -->
        <div style="background: rgba(56, 189, 248, 0.06); border: 1px dashed rgba(56, 189, 248, 0.3); border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem; text-align: center;">
          <div style="font-size: 0.78rem; color: var(--accent-blue); font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
            ⚡ Quick Demo Accounts
          </div>
          <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <button type="button" class="btn btn-secondary btn-sm" id="fill-demo-rohan" style="font-size: 0.78rem;">
              Rohan (Student)
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="fill-demo-priya" style="font-size: 0.78rem;">
              Priya (Student)
            </button>
          </div>
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label for="email" class="form-label">College Email Address <span class="required">*</span></label>
            <input type="email" id="email" class="form-control" placeholder="e.g. rohan@campus.edu" required autocomplete="email">
          </div>

          <div class="form-group">
            <div class="flex-between" style="margin-bottom: 0.45rem;">
              <label for="password" class="form-label" style="margin-bottom: 0;">Password <span class="required">*</span></label>
            </div>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
            Sign In to Portal
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem; font-size: 0.92rem; color: var(--text-muted);">
          Don't have an account yet?
          <a href="/signup.html" style="font-weight: 600; color: var(--accent-blue);">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Universal Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
</body>
</html>
